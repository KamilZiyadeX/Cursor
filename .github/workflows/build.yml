name: Derle

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LanChat-windows.exe
            binary: target/release/lanchat.exe
          - os: macos-latest
            artifact: LanChat-macos
            binary: target/release/lanchat
          - os: ubuntu-latest
            artifact: LanChat-linux
            binary: target/release/lanchat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testler
        run: cargo test
      - name: Derleme
        run: cargo build --release
      - name: Paketle
        shell: bash
        run: mkdir -p dist && cp "${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
