[package]
name = "lanchat"
version = "0.2.1"
description = "Aynı yerel ağdaki bilgisayarlar arasında mesaj ve dosya gönderme uygulaması"
license = "MIT"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.37.0"
fs4 = "1.1.0"
gethostname = "1.1.0"
getrandom = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
socket2 = { version = "0.6.5", features = ["all"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Şifreleme kütüphaneleri hata ayıklama derlemesinde de hızlı çalışsın
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"
tray-icon = "0.26"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio"] }
